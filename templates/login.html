<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand-row">
    <img src="/static/logo.svg" alt="Logo" width="36" height="36">
    <span class="brand-name">CREDORA</span>
</div>
            <h1>Admin Login</h1>
            <p class="subtitle">Sign in to view applicant records</p>

            {% if error %}
                <p style="color:#dc2626; margin-bottom:14px; font-size:14px;">{{ error }}</p>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Log In</button>
            </form>

            <a class="records-link" href="/">← Back to Prediction Form</a>
        </div>
    </div>
</body>
</html>
