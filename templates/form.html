<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Approval Prediction System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand-row">
    <img src="/static/logo.svg" alt="Logo" width="36" height="36">
    <span class="brand-name">CREDORA</span>
</div>
            <h1>Loan Approval Prediction</h1>
            <p class="subtitle">Fill in the applicant's financial profile below</p>

            <form action="/predict" method="POST">
                <div class="form-group">
                    <label>Applicant Name</label>
                    <input type="text" name="applicant_name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Number of Dependents</label>
                        <input type="number" name="no_of_dependents" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Education</label>
                        <select name="education" required>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Self Employed</label>
                        <select name="self_employed" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>CIBIL / Credit Score</label>
                        <input type="number" name="cibil_score" min="300" max="900" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Annual Income (₱)</label>
                        <input type="number" name="income_annum" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Loan Amount Requested (₱)</label>
                        <input type="number" name="loan_amount" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Loan Term (years)</label>
                    <input type="number" name="loan_term" min="1" required>
                </div>

                <h3 class="section-title">Asset Values (₱)</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>Residential Assets</label>
                        <input type="number" name="residential_assets_value" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Commercial Assets</label>
                        <input type="number" name="commercial_assets_value" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Luxury Assets</label>
                        <input type="number" name="luxury_assets_value" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Bank Assets</label>
                        <input type="number" name="bank_asset_value" min="0" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn">Predict Loan Approval</button>
            </form>

            <script>
                document.querySelector("form").addEventListener("submit", function () {
                    const btn = document.getElementById("submitBtn");
                    btn.disabled = true;
                    btn.textContent = "Analyzing Profile...";
                });
            </script>

            <a class="records-link" href="/records">View All Applicant Records →</a>
        </div>
    </div>
</body>
</html>
