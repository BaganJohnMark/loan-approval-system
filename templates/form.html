<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Loan Application - CREDORA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@500&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "deep-forest": "#1A5319",
                    "primary": "#003b05",
                    "technical-navy": "#1B3C73",
                    "secondary": "#605e5b",
                    "on-surface": "#1e1b18",
                    "surface-ivory": "#FCF8F3",
                    "surface-container-lowest": "#ffffff",
                    "border-muted": "#E2E8F0",
                    "secondary-container": "#e6e2dd",
                    "error": "#ba1a1a",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a"
                },
                fontFamily: {
                    "headline": ["Source Serif 4", "serif"],
                    "body": ["Hanken Grotesk", "sans-serif"],
                    "mono": ["JetBrains Mono", "monospace"]
                },
                spacing: {
                    "stack-lg": "48px",
                    "stack-md": "24px",
                    "stack-sm": "8px",
                    "gutter": "24px"
                }
            }
        }
    };
</script>
<style>
  .field-input {
    width: 100%; background: #ffffff; border: 1px solid #E2E8F0; border-radius: 0.25rem;
    padding: 0.75rem 1rem; font-family: 'JetBrains Mono', monospace; font-size: 14px;
    color: #1e1b18; transition: border-color .15s, box-shadow .15s; outline: none;
  }
  .field-input:focus { border-color: #1A5319; box-shadow: 0 0 0 1px #1A5319; }
  .field-input:disabled { background: #f1f1ef; color: #999; cursor: not-allowed; }
  .field-label { font-family: 'Hanken Grotesk', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: #605e5b; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in-section { opacity: 0; animation: fadeInUp 0.55s ease-out forwards; }
  .fade-in-card { opacity: 0; animation: fadeInUp 0.6s ease-out forwards; }

  .toast-overlay {
    position: fixed; inset: 0; background: rgba(15,42,40,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .toast-overlay.active { opacity: 1; pointer-events: auto; }
  .toast-box {
    background: #FCF8F3; border-radius: 8px; max-width: 420px; width: 90%;
    padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    transform: scale(0.92) translateY(10px); transition: transform 0.25s ease;
  }
  .toast-overlay.active .toast-box { transform: scale(1) translateY(0); }
  .toast-title { font-family:'Source Serif 4', serif; font-weight:700; font-size:18px; color:#A5401F; margin-bottom:10px; }
  .toast-list { font-size:13px; color:#605e5b; margin:0 0 18px; padding-left:18px; }
  .toast-buttons { display:flex; gap:10px; }
  .toast-btn { flex:1; padding:10px; border-radius:4px; font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.04em; cursor:pointer; border:none; transition: opacity .15s; }
  .toast-btn:hover { opacity:0.85; }
  .toast-btn-cancel { background:#e6e2dd; color:#1e1b18; }
  .toast-btn-confirm { background:#1A5319; color:#fff; }

  .field-input:focus { transform: translateY(-1px); }
</style>
</head>
<body class="bg-surface-ivory min-h-screen flex text-on-surface font-body text-body-md">
<div class="flex flex-col flex-1 min-w-0 bg-deep-forest justify-center items-center py-12 px-4">
<div class="bg-surface-ivory rounded-lg shadow-sm border border-border-muted max-w-[720px] w-full p-8 md:p-12 relative flex flex-col mx-auto fade-in-card">

<div class="flex items-center justify-between mb-2">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-deep-forest text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
    <span class="field-label text-secondary">CREDORA</span>
  </div>
  <button type="button" id="darkToggle" class="material-symbols-outlined text-secondary hover:text-deep-forest cursor-pointer" title="Toggle dark mode">dark_mode</button>
</div>

<h1 class="font-headline text-[32px] font-semibold text-deep-forest mb-1">Loan Approval Prediction</h1>
<p class="text-secondary text-body-md mb-8">Fill in the applicant's financial profile below</p>

<form action="/predict" method="POST" enctype="multipart/form-data" id="loanForm" class="space-y-stack-lg">

  <section class="fade-in-section" style="animation-delay:.05s;">
    <div class="flex items-center gap-4 mb-6">
      <h2 class="font-headline text-[24px] font-semibold text-on-surface whitespace-nowrap">Applicant Details</h2>
      <div class="h-px bg-border-muted flex-grow"></div>
    </div>
    <div class="flex flex-col gap-stack-sm">
      <label class="field-label">Applicant Name</label>
      <input class="field-input" name="applicant_name" placeholder="Full Name" type="text" required/>
    </div>
  </section>

  <section class="fade-in-section" style="animation-delay:.1s;">
    <div class="flex items-center gap-4 mb-6">
      <h2 class="font-headline text-[24px] font-semibold text-on-surface whitespace-nowrap">Address</h2>
      <div class="h-px bg-border-muted flex-grow"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-stack-md">
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Region</label>
        <select class="field-input appearance-none" name="region" id="regionSelect" required>
          <option value="">-- Piliin ang Rehiyon --</option>
        </select>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Province</label>
        <select class="field-input appearance-none" name="province" id="provinceSelect" required disabled>
          <option value="">-- Piliin muna ang Rehiyon --</option>
        </select>
      </div>
      <div class="flex flex-col gap-stack-sm md:col-span-2">
        <label class="field-label">City / Municipality</label>
        <input class="field-input" name="city" id="cityInput" placeholder="Piliin muna ang Probinsya, o mag-type" type="text" list="cityList" required/>
        <datalist id="cityList"></datalist>
      </div>
    </div>
  </section>

  <section class="fade-in-section" style="animation-delay:.15s;">
    <div class="flex items-center gap-4 mb-6">
      <h2 class="font-headline text-[24px] font-semibold text-on-surface whitespace-nowrap">Identity Verification</h2>
      <div class="h-px bg-border-muted flex-grow"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-stack-md">
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Valid ID Type</label>
        <select class="field-input appearance-none" name="id_type" required>
          <option value="Philippine National ID">Philippine National ID</option>
          <option value="Passport">Passport</option>
          <option value="Driver's License">Driver's License</option>
          <option value="UMID">UMID</option>
          <option value="SSS ID">SSS ID</option>
          <option value="Postal ID">Postal ID</option>
        </select>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">ID Number</label>
        <input class="field-input" name="id_number" type="text" required/>
      </div>
      <div class="flex flex-col gap-stack-sm md:col-span-2">
        <label class="field-label">Upload Photo of Valid ID</label>
        <label id="fileDropzone" class="border border-dashed border-border-muted bg-surface-container-lowest rounded p-4 flex items-center gap-4 hover:border-deep-forest transition-colors cursor-pointer group">
          <span class="bg-secondary-container px-4 py-2 rounded field-label text-on-surface group-hover:bg-deep-forest group-hover:text-white transition-colors">Choose File</span>
          <span id="fileNameLabel" class="text-secondary text-[14px] font-mono">No file chosen</span>
          <span id="fileCheckmark" class="material-symbols-outlined text-deep-forest ml-auto" style="display:none; font-variation-settings:'FILL' 1;">check_circle</span>
          <input type="file" name="id_photo" accept=".jpg,.jpeg,.png,.pdf" class="hidden" required onchange="handleFileChange(this)"/>
        </label>
      </div>
    </div>
  </section>

  <section class="fade-in-section" style="animation-delay:.2s;">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-stack-md">
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Number of Dependents</label>
        <input class="field-input" name="no_of_dependents" type="number" min="0" required/>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Education</label>
        <select class="field-input appearance-none" name="education" required>
          <option value="Graduate">Graduate</option>
          <option value="Not Graduate">Not Graduate</option>
        </select>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Self Employed</label>
        <select class="field-input appearance-none" name="self_employed" required>
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">CIBIL / Credit Score</label>
        <input class="field-input" name="cibil_score" type="number" min="300" max="900" required/>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Annual Income (₱)</label>
        <input class="field-input money-input" name="income_annum" type="text" inputmode="numeric" required/>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Loan Amount Requested (₱)</label>
        <input class="field-input money-input" name="loan_amount" type="text" inputmode="numeric" required/>
      </div>
      <div class="flex flex-col gap-stack-sm md:col-span-2">
        <label class="field-label">Loan Term (Years)</label>
        <input class="field-input" name="loan_term" type="number" min="1" required/>
      </div>
    </div>
  </section>

  <section class="fade-in-section" style="animation-delay:.25s;">
    <div class="flex items-center gap-4 mb-6">
      <h2 class="font-headline text-[24px] font-semibold text-on-surface whitespace-nowrap">Asset Values (₱)</h2>
      <div class="h-px bg-border-muted flex-grow"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-gutter gap-y-stack-md">
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Residential Assets</label>
        <input class="field-input money-input" name="residential_assets_value" type="text" inputmode="numeric" required/>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Commercial Assets</label>
        <input class="field-input money-input" name="commercial_assets_value" type="text" inputmode="numeric" required/>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Luxury Assets</label>
        <input class="field-input money-input" name="luxury_assets_value" type="text" inputmode="numeric" required/>
      </div>
      <div class="flex flex-col gap-stack-sm">
        <label class="field-label">Bank Assets</label>
        <input class="field-input money-input" name="bank_asset_value" type="text" inputmode="numeric" required/>
      </div>
    </div>
  </section>

  <div class="pt-6 fade-in-section" style="animation-delay:.3s;">
    <button id="submitBtn" class="w-full bg-deep-forest hover:bg-primary text-white field-label uppercase py-4 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-technical-navy" type="submit">
      Predict Loan Approval
    </button>
    <a class="inline-flex items-center gap-1 mt-6 text-deep-forest hover:text-primary transition-colors field-label" href="/records">
      View All Applicant Records <span class="material-symbols-outlined text-sm">arrow_forward</span>
    </a>
  </div>
</form>
</div>
</div>

<div class="toast-overlay" id="toastOverlay">
  <div class="toast-box">
    <div class="toast-title">⚠️ May Napansing Hindi Pangkaraniwang Datos</div>
    <ul class="toast-list" id="toastList"></ul>
    <p style="font-size:13px; color:#1e1b18; margin-bottom:16px; font-weight:600;">Sigurado ka bang ipagpatuloy?</p>
    <div class="toast-buttons">
      <button type="button" class="toast-btn toast-btn-cancel" id="toastCancel">Kanselahin</button>
      <button type="button" class="toast-btn toast-btn-confirm" id="toastConfirm">Ipagpatuloy</button>
    </div>
  </div>
</div>

<script>
  function handleFileChange(input) {
    const label = document.getElementById("fileNameLabel");
    const check = document.getElementById("fileCheckmark");
    if (input.files[0]) {
      label.textContent = input.files[0].name;
      check.style.display = "inline-block";
    } else {
      label.textContent = "No file chosen";
      check.style.display = "none";
    }
  }

  const phRegions = {
    "NCR": ["Metro Manila"],
    "CAR": ["Abra", "Apayao", "Benguet", "Ifugao", "Kalinga", "Mountain Province"],
    "Region I": ["Ilocos Norte", "Ilocos Sur", "La Union", "Pangasinan"],
    "Region II": ["Batanes", "Cagayan", "Isabela", "Nueva Vizcaya", "Quirino"],
    "Region III": ["Aurora", "Bataan", "Bulacan", "Nueva Ecija", "Pampanga", "Tarlac", "Zambales"],
    "Region IV-A": ["Batangas", "Cavite", "Laguna", "Quezon", "Rizal"],
    "MIMAROPA": ["Marinduque", "Occidental Mindoro", "Oriental Mindoro", "Palawan", "Romblon"],
    "Region V": ["Albay", "Camarines Norte", "Camarines Sur", "Catanduanes", "Masbate", "Sorsogon"],
    "Region VI": ["Aklan", "Antique", "Capiz", "Guimaras", "Iloilo", "Negros Occidental"],
    "Region VII": ["Bohol", "Cebu", "Negros Oriental", "Siquijor"],
    "Region VIII": ["Biliran", "Eastern Samar", "Leyte", "Northern Samar", "Samar", "Southern Leyte"],
    "Region IX": ["Zamboanga del Norte", "Zamboanga del Sur", "Zamboanga Sibugay"],
    "Region X": ["Bukidnon", "Camiguin", "Lanao del Norte", "Misamis Occidental", "Misamis Oriental"],
    "Region XI": ["Davao de Oro", "Davao del Norte", "Davao del Sur", "Davao Occidental", "Davao Oriental"],
    "Region XII": ["Cotabato", "Sarangani", "South Cotabato", "Sultan Kudarat"],
    "Region XIII": ["Agusan del Norte", "Agusan del Sur", "Dinagat Islands", "Surigao del Norte", "Surigao del Sur"],
    "BARMM": ["Basilan", "Lanao del Sur", "Maguindanao del Norte", "Maguindanao del Sur", "Sulu", "Tawi-Tawi"]
  };

  const regionLabels = {
    "NCR": "NCR (National Capital Region)", "CAR": "CAR (Cordillera Administrative Region)",
    "Region I": "Region I (Ilocos Region)", "Region II": "Region II (Cagayan Valley)",
    "Region III": "Region III (Central Luzon)", "Region IV-A": "Region IV-A (CALABARZON)",
    "MIMAROPA": "MIMAROPA", "Region V": "Region V (Bicol Region)",
    "Region VI": "Region VI (Western Visayas)", "Region VII": "Region VII (Central Visayas)",
    "Region VIII": "Region VIII (Eastern Visayas)", "Region IX": "Region IX (Zamboanga Peninsula)",
    "Region X": "Region X (Northern Mindanao)", "Region XI": "Region XI (Davao Region)",
    "Region XII": "Region XII (SOCCSKSARGEN)", "Region XIII": "Region XIII (Caraga)",
    "BARMM": "BARMM (Bangsamoro)"
  };

  const phCities = {
    "Metro Manila": ["Manila", "Quezon City", "Makati", "Taguig", "Pasig", "Mandaluyong", "Pasay", "Parañaque", "Caloocan", "Las Piñas", "Muntinlupa", "Marikina", "Valenzuela", "Malabon", "Navotas", "San Juan", "Pateros"],
    "Pampanga": ["Angeles City", "San Fernando", "Mabalacat", "Apalit", "Guagua", "Mexico"],
    "Bulacan": ["Malolos", "Meycauayan", "San Jose del Monte", "Baliwag", "Marilao", "Sta. Maria"],
    "Cavite": ["Bacoor", "Dasmariñas", "Imus", "Tagaytay", "General Trias", "Trece Martires"],
    "Laguna": ["Calamba", "Santa Rosa", "San Pablo", "Biñan", "Cabuyao", "Los Baños"],
    "Batangas": ["Batangas City", "Lipa", "Tanauan", "Sto. Tomas", "Nasugbu"],
    "Rizal": ["Antipolo", "Cainta", "Taytay", "Angono", "Binangonan"],
    "Quezon": ["Lucena", "Tayabas", "Sariaya", "Candelaria"],
    "Nueva Ecija": ["Cabanatuan", "Gapan", "Palayan", "San Jose"],
    "Tarlac": ["Tarlac City", "Concepcion", "Paniqui"],
    "Bataan": ["Balanga", "Mariveles", "Orani"],
    "Zambales": ["Olongapo", "Iba", "Subic"],
    "Cebu": ["Cebu City", "Mandaue", "Lapu-Lapu", "Talisay", "Toledo", "Danao"],
    "Bohol": ["Tagbilaran", "Panglao", "Ubay"],
    "Negros Oriental": ["Dumaguete", "Bais", "Bayawan"],
    "Iloilo": ["Iloilo City", "Passi"],
    "Negros Occidental": ["Bacolod", "Bago", "Silay", "Talisay"],
    "Aklan": ["Kalibo", "Boracay/Malay"],
    "Capiz": ["Roxas City"],
    "Antique": ["San Jose de Buenavista"],
    "Davao del Sur": ["Davao City", "Digos"],
    "Davao del Norte": ["Tagum", "Panabo"],
    "South Cotabato": ["General Santos", "Koronadal"],
    "Misamis Oriental": ["Cagayan de Oro", "El Salvador"],
    "Bukidnon": ["Malaybalay", "Valencia"],
    "Zamboanga del Sur": ["Zamboanga City", "Pagadian"],
    "Lanao del Norte": ["Iligan"],
    "Agusan del Norte": ["Butuan"],
    "Surigao del Norte": ["Surigao City"],
    "Leyte": ["Tacloban", "Ormoc"],
    "Samar": ["Catbalogan"],
    "Albay": ["Legazpi", "Tabaco", "Ligao"],
    "Camarines Sur": ["Naga", "Iriga"],
    "Sorsogon": ["Sorsogon City"],
    "Pangasinan": ["Dagupan", "Urdaneta", "San Carlos"],
    "La Union": ["San Fernando"],
    "Ilocos Norte": ["Laoag"],
    "Ilocos Sur": ["Vigan", "Candon"],
    "Cagayan": ["Tuguegarao"],
    "Isabela": ["Ilagan", "Santiago"],
    "Benguet": ["Baguio City", "La Trinidad"],
    "Palawan": ["Puerto Princesa"],
    "Oriental Mindoro": ["Calapan"],
    "Marinduque": ["Boac"]
  };

  const regionSelect = document.getElementById("regionSelect");
  const provinceSelect = document.getElementById("provinceSelect");
  const cityInput = document.getElementById("cityInput");
  const cityList = document.getElementById("cityList");

  Object.keys(phRegions).forEach(function (regionKey) {
    const opt = document.createElement("option");
    opt.value = regionKey;
    opt.textContent = regionLabels[regionKey];
    regionSelect.appendChild(opt);
  });

  regionSelect.addEventListener("change", function () {
    const selectedRegion = this.value;
    provinceSelect.innerHTML = "";
    cityList.innerHTML = "";
    cityInput.value = "";

    if (!selectedRegion) {
      provinceSelect.disabled = true;
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "-- Piliin muna ang Rehiyon --";
      provinceSelect.appendChild(opt);
      return;
    }

    provinceSelect.disabled = false;
    const placeholderOpt = document.createElement("option");
    placeholderOpt.value = "";
    placeholderOpt.textContent = "-- Piliin ang Probinsya --";
    provinceSelect.appendChild(placeholderOpt);

    phRegions[selectedRegion].forEach(function (province) {
      const opt = document.createElement("option");
      opt.value = province;
      opt.textContent = province;
      provinceSelect.appendChild(opt);
    });
  });

  provinceSelect.addEventListener("change", function () {
    const selectedProvince = this.value;
    cityList.innerHTML = "";
    cityInput.value = "";

    if (!selectedProvince) {
      cityInput.placeholder = "Piliin muna ang Probinsya, o mag-type";
      return;
    }

    const cities = phCities[selectedProvince];
    if (cities && cities.length > 0) {
      cities.forEach(function (city) {
        const opt = document.createElement("option");
        opt.value = city;
        cityList.appendChild(opt);
      });
      cityInput.placeholder = "Piliin sa listahan o mag-type ng ibang bayan/lungsod";
    } else {
      cityInput.placeholder = "I-type ang bayan/lungsod";
    }
  });

  document.querySelectorAll(".money-input").forEach(function (input) {
    input.addEventListener("input", function () {
      let raw = input.value.replace(/,/g, "").replace(/[^0-9]/g, "");
      input.value = raw ? Number(raw).toLocaleString("en-US") : "";
    });
  });

  function rawNumber(name) {
    const val = document.querySelector(`[name="${name}"]`).value;
    return Number(val.replace(/,/g, "")) || 0;
  }

  function checkSuspiciousData() {
    const income = rawNumber("income_annum");
    const loan = rawNumber("loan_amount");
    const dependents = Number(document.querySelector('[name="no_of_dependents"]').value) || 0;
    const totalAssets =
      rawNumber("residential_assets_value") +
      rawNumber("commercial_assets_value") +
      rawNumber("luxury_assets_value") +
      rawNumber("bank_asset_value");

    const warnings = [];
    if (income > 0 && loan > income * 10) warnings.push("Ang hiniling na loan amount ay higit 10x ng annual income.");
    if (income > 0 && totalAssets > income * 30) warnings.push("Ang kabuuang asset value ay hindi pangkaraniwang mataas kumpara sa income.");
    if (income > 0 && totalAssets < income * 0.05) warnings.push("Napakababa ng asset value kumpara sa income — posibleng kulang o maling datos.");
    if (dependents > 10) warnings.push("Hindi pangkaraniwang bilang ng dependents.");
    return warnings;
  }

  const toastOverlay = document.getElementById("toastOverlay");
  const toastList = document.getElementById("toastList");
  const toastCancel = document.getElementById("toastCancel");
  const toastConfirm = document.getElementById("toastConfirm");

  function showToastConfirm(warnings) {
    return new Promise(function (resolve) {
      toastList.innerHTML = warnings.map(w => `<li>${w}</li>`).join("");
      toastOverlay.classList.add("active");

      function cleanup(result) {
        toastOverlay.classList.remove("active");
        toastCancel.removeEventListener("click", onCancel);
        toastConfirm.removeEventListener("click", onConfirm);
        resolve(result);
      }
      function onCancel() { cleanup(false); }
      function onConfirm() { cleanup(true); }

      toastCancel.addEventListener("click", onCancel);
      toastConfirm.addEventListener("click", onConfirm);
    });
  }

  document.getElementById("loanForm").addEventListener("submit", async function (e) {
    const warnings = checkSuspiciousData();
    if (warnings.length > 0) {
      e.preventDefault();
      const proceed = await showToastConfirm(warnings);
      if (!proceed) return;

      document.querySelectorAll(".money-input").forEach(function (input) {
        input.value = input.value.replace(/,/g, "");
      });
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Analyzing Profile...";
      this.submit();
      return;
    }

    document.querySelectorAll(".money-input").forEach(function (input) {
      input.value = input.value.replace(/,/g, "");
    });
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Analyzing Profile...";
  });
</script>

<script>
  const darkToggle = document.getElementById("darkToggle");
  function applyDarkPref() {
    const isDark = localStorage.getItem("credora-dark") === "1";
    darkToggle.textContent = isDark ? "light_mode" : "dark_mode";
  }
  darkToggle.addEventListener("click", function () {
    const isDark = localStorage.getItem("credora-dark") === "1";
    localStorage.setItem("credora-dark", isDark ? "0" : "1");
    applyDarkPref();
  });
  applyDarkPref();
</script>

</body>
