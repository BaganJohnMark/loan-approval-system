<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Model Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <div class="container wide">
        <div class="card">
            <svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
  <circle cx="22" cy="22" r="20" fill="#1F6F5C"/>
  <circle cx="22" cy="22" r="20" fill="none" stroke="#B08D57" stroke-width="1.5"/>
  <circle cx="22" cy="22" r="16" fill="none" stroke="#B08D57" stroke-width="0.75" stroke-dasharray="1.5 2.5"/>
  <path d="M14 23.5L19 28.5L30 16" fill="none" stroke="#FDFBF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
            <h1>Feature Importance</h1>
            <p class="subtitle">Which financial factors influence the model's approval decisions the most</p>

            <a class="records-link" href="/records">← Back to Records</a>
            <a class="records-link" href="/logout">Log Out</a>

            <div style="max-width: 700px; margin: 30px auto;">
                <canvas id="importanceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const labels = {{ feature_importance | map(attribute='feature') | list | tojson }};
        const values = {{ feature_importance | map(attribute='importance') | list | tojson }};

        new Chart(document.getElementById('importanceChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Importance Score',
                    data: values,
                    backgroundColor: '#2563eb',
                    borderRadius: 6,
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
